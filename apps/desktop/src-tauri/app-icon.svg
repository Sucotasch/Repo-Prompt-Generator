  <!-- Top window dots -->
  <circle cx="132" cy="144" r="10" fill="#818CF8" fill-opacity="0.85"/>
  <circle cx="164" cy="144" r="10" fill="#38BDF8" fill-opacity="0.85"/>
  <circle cx="196" cy="144" r="10" fill="#34D399" fill-opacity="0.85"/>

  <!-- Prompt chevron '>' -->
